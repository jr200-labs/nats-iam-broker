# GENERATED/SHARED WORKFLOW: copied into consuming repos by sync-shared.
# Do not edit in consuming repos; change jr200-labs/github-action-templates and sync.
name: renovate

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      repair-lockfiles:
        description: Overwrite stale pnpm lockfiles on existing Renovate branches
        required: false
        type: boolean
        default: false
      rebase-branches:
        description: Rebase Renovate branches that are behind the base branch
        required: false
        type: boolean
        default: false

# Only the caller's TOP-LEVEL permissions cascade into reusable
# workflows. The reusable's renovate job needs contents/issues/PR
# writes for repo state + actions:read for its post-step that fetches
# the job log to detect package-lookup failures + packages:read so Renovate
# can authenticate private GHCR lookups as this repository. See AGENTS.md.
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: read
  packages: read

jobs:
  renovate:
    uses: jr200-labs/github-action-templates/.github/workflows/renovate.yaml@master
    with:
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
      renovate-image: ${{ vars.RENOVATE_IMAGE }}
      repair-lockfiles: ${{ github.event_name == 'workflow_dispatch' && inputs.repair-lockfiles }}
      rebase-branches: ${{ github.event_name == 'workflow_dispatch' && inputs.rebase-branches }}
    secrets:
      INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
