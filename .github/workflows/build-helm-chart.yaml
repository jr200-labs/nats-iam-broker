# GENERATED/SHARED WORKFLOW: copied into consuming repos by sync-shared.
# Do not edit in consuming repos; change jr200-labs/github-action-templates and sync.
name: build-helm-chart
run-name: ${{ github.event.client_payload['release-tag'] || format('{0} by @{1}', github.event_name, github.actor) }}

# Triggered by release-please publishing a tag. Builds + uploads a
# Helm chart to the org's chart repo. Verbatim across consumers; each
# consuming org must define:
#   - vars.HELM_CHART_REPO       (e.g. jr200/helm-charts-private)
#   - secrets.CHARTS_WRITE_TOKEN (PAT with contents:write on that repo)

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: "refs/heads/master"
      tag:
        description: chart-version
        required: false
        type: string
        default: dev

permissions:
  contents: read

jobs:
  configure:
    uses: jr200-labs/github-action-templates/.github/workflows/preconfigure.yaml@master
    with:
      event_name: ${{ toJson(github.event_name) }}
      event: ${{ toJson(github.event) }}
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}

  main:
    needs: configure
    uses: jr200-labs/github-action-templates/.github/workflows/build_helm_chart.yaml@master
    with:
      checkout-ref: ${{ fromJson(needs.configure.outputs.context).checkout-ref }}
      chart_repo: ${{ vars.HELM_CHART_REPO }}
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    secrets:
      charts_write_token: ${{ secrets.CHARTS_WRITE_TOKEN }}

  notify-renovate:
    needs: [configure, main]
    if: github.event_name == 'repository_dispatch'
    uses: jr200-labs/github-action-templates/.github/workflows/notify_artifact_published.yaml@master
    with:
      checkout-ref: ${{ fromJson(needs.configure.outputs.context).checkout-ref }}
      publisher: helm
      component: ${{ fromJson(needs.configure.outputs.context).component || '.' }}
      version: ${{ fromJson(needs.configure.outputs.context).tag }}
      source-sha: ${{ fromJson(needs.configure.outputs.context).sha || '' }}
      dispatch-client-id: ${{ vars.RENOVATE_DISPATCH_CLIENT_ID || vars.INTEGRATION_CLIENT_ID }}
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    secrets:
      dispatch_app_private_key: ${{ secrets.RENOVATE_DISPATCH_APP_PRIVATE_KEY }}
      integration_app_private_key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
